apiVersion: v1
kind: Namespace
metadata:
  name: vcluster-demo-1
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: virtual-cluster
  namespace: vcluster-demo-1
spec:
  controlPlaneRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: VCluster
    name: virtual-cluster
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: VCluster
    name: virtual-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: VCluster
metadata:
  name: virtual-cluster
  namespace: vcluster-demo-1
spec:
  controlPlaneEndpoint:
    host: ""
    port: 0
  helmRelease:
    chart:
      name: vcluster
      repo: https://charts.loft.sh
      version: 0.22.1
    values: |-
      exportKubeConfig:
        # Set a meaningful context name
        context: default
        # Use a server URL that is accessible from the Flux controllers
        server: https://virtual-cluster.vcluster-demo-1.svc.cluster.local:443
        # Skip TLS verification when Flux connects to the vCluster
        insecure: true
        # Specify the secret where the KubeConfig is stored
        secret:
          name: vcluster-flux-kubeconfig
      controlPlane:
        proxy:
          extraSANs:
          - "virtual-cluster.vcluster-demo-1.svc.cluster.local"
