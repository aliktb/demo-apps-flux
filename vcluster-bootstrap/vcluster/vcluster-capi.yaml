apiVersion: v1
kind: Namespace
metadata:
  name: vcluster-demo-1
---
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: virtual-cluster
  namespace: vcluster-demo-1
spec:
  controlPlaneRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: VCluster
    name: virtual-cluster
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
    kind: VCluster
    name: virtual-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: VCluster
metadata:
  name: virtual-cluster
  namespace: vcluster-demo-1
spec:
  # controlPlaneEndpoint:
  #   host: ""
  #   port: 0
  controlPlaneEndpoint:
    host: "virtual-cluster.vcluster-demo-1.svc.cluster.local"
    port: 443
  helmRelease:
    chart:
      name: vcluster
      repo: https://charts.loft.sh
      version: v0.3.0-alpha.2
    values: |-
      exportKubeConfig:
        # Set a meaningful context name
        context: default
        # Use a server URL that is accessible from the Flux controllers
        server: https://virtual-cluster.vcluster-demo-1.svc.cluster.local
        # Skip TLS verification when Flux connects to the vCluster
        insecure: true
        # Specify the secret where the KubeConfig is stored
        secret:
          name: vcluster-flux-kubeconfig
      controlPlane:
        proxy:
          extraSANs:
          - "virtual-cluster.vcluster-demo-1.svc.cluster.local"
      # sync:
      #   fromHost:
      #     secrets:
      #       enabled: true
      #       mappings:
      #         byName:
      #           # syncs all Secrets from "foo" namespace
      #           # to the "bar" namespace in a virtual cluster. Secrets names are unchanged.
      #           "flux-system/flux-system": "flux-system/flux-system"
