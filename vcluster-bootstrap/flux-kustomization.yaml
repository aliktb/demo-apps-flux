apiVersion: v1
kind: Namespace
metadata:
  name: vcluster-demo-1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-operator
  namespace: flux-system
spec:
  dependsOn:
  - name: cert-manager
  interval: 1h
  retryInterval: 3m
  timeout: 20m
  prune: true
  wait: true
  path: ./vcluster-bootstrap/capi-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 3m
  timeout: 20m
  prune: true
  wait: true
  path: ./vcluster-bootstrap/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-capi
  namespace: flux-system
spec:
  dependsOn:
  - name: capi-operator
  interval: 1h
  retryInterval: 3m
  timeout: 20m
  prune: true
  wait: true
  path: ./vcluster-bootstrap/vcluster
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  healthChecks:
  - apiVersion: v1
    kind: Secret
    name: vcluster-flux-kubeconfig
    namespace: vcluster-demo-1
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-flux-bootstrap
  namespace: vcluster-demo-1
spec:
  dependsOn:
  - name: vcluster-capi
    namespace: flux-system
  interval: 1h
  retryInterval: 3m
  timeout: 20m
  prune: true
  wait: true
  path: ./clusters/virtual-cluster
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  kubeConfig:
    secretRef:
      key: config
      name: vcluster-flux-kubeconfig
