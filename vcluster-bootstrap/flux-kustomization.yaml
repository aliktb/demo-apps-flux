apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-operator
  namespace: flux-system
spec:
  dependsOn:
  - name: cert-manager
  interval: 1h
  retryInterval: 3m
  timeout: 20m
  prune: true
  wait: true
  path: ./vcluster-bootstrap/capi-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 3m
  timeout: 20m
  prune: true
  wait: true
  path: ./vcluster-bootstrap/cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
