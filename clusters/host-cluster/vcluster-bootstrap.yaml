apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-bootstrap
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 3m
  timeout: 20m
  prune: true
  wait: true
  path: ./vcluster-bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
